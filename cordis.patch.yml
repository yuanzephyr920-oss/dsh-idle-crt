# ============================================================================
# dsh-idle-crt —— DSH bundle patch（挂载声明）
# ----------------------------------------------------------------------------
# 本文件把待机显像管插件的宿主半区插入 profile 配置树。浏览器半区不通过客户端
# 模块注册表加载（桌面端的 __DSH_BOOT__ 由安装包静态 dist 直出），而是由宿主
# 半区经 `webserver/index-inject` 注册一条内联 script 行，页面侧自举加载
# `/dsh-idle-crt/client.js`；页面加载时什么都不做，等「空闲十分钟 + 没有活干」
# 才把 CRT 板挂上来。
#
# 安装（本地开发）：
#   dsh plugin --profile desktop add link:<本目录绝对路径>
# 宿主半区（事件监听、/dsh-idle-crt/* 路由）改了要重启 DSH；浏览器半区不用：
# 宿主每次都从磁盘读 lib/client.js 下发（带 X-Idle-Crt-Rev），刷新页面即生效。
# ============================================================================

- insert:
    - id: dsh-idle-crt
      name: dsh-idle-crt
      config:
        enabled: true
        idleMs: 600000
        pollMs: 1500
